name: Portable HTML & Hermes delivery tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject tracked runtime outputs in public Git
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files -- 'reports/portable/**' 'reports/deliveries/**' 'dashboards/dashboard_standalone.html')"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Private/runtime artifacts are tracked in Git. Remove them from HEAD."
            echo "$forbidden"
            exit 1
          fi
          echo "No generated portable HTML, manifest, Telegram receipts, or dashboard snapshot tracked."
      - name: Offline HTML and Telegram transport regression tests
        run: python3 -m unittest -v tests.unit.test_portable_report tests.unit.test_hermes_skill tests.unit.test_hermes_bridge tests.unit.test_financial_integrity tests.unit.test_editorial_integrity tests.unit.test_ingest_and_news_quality tests.unit.test_daily_close_cutoff tests.unit.test_52week_and_partial_archive tests.unit.test_archive_reconciliation tests.unit.test_researchbitcoin_complement tests.unit.test_specialized_news_rag tests.unit.test_knowledge_corpus_v2 tests.unit.test_historical_archive_and_design tests.unit.test_archive_schema_v1 tests.unit.test_research_studio_v2 tests.unit.test_market_context_sqlite tests.unit.test_market_raw_reconcile tests.unit.test_market_temporal_quality tests.unit.test_market_history_pilot tests.unit.test_market_history_batch tests.unit.test_market_history_forward tests.unit.test_market_v3_preflight tests.unit.test_market_v3_migration_rehearsal tests.unit.test_market_v3_migrator_atomicity tests.unit.test_market_r10c_quality_gate tests.unit.test_market_r10c_real_auditors_e2e tests.unit.test_market_r10c_shared_snapshot tests.unit.test_market_network_diagnostics tests.unit.test_binance_https_probe tests.unit.test_binance_oi_endpoint_probe tests.unit.test_market_request_lineage_v2 tests.unit.test_market_request_lineage_audit tests.unit.test_fred_cli_and_market_evidence
