name: Portable HTML & Hermes delivery tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline HTML and Telegram transport regression tests
        run: python3 -m unittest -v tests.unit.test_portable_report tests.unit.test_hermes_skill tests.unit.test_hermes_bridge tests.unit.test_financial_integrity tests.unit.test_editorial_integrity tests.unit.test_ingest_and_news_quality tests.unit.test_daily_close_cutoff
