name: Portable HTML & Hermes delivery tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-python314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Installed compatibility and WAL restore on Python 3.14
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BTC_RESEARCH_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -c 'import sys, sqlite3; print(sys.version); print(sqlite3.sqlite_version)'
          python3 -m unittest -v tests.unit.test_installed_schema tests.unit.test_installed_evidence tests.unit.test_compatibility_acquisition tests.unit.test_installed_pipeline tests.unit.test_installed_live_policy tests.unit.test_installed_live_transport tests.unit.test_installed_live_storage tests.unit.test_installed_live_recovery tests.unit.test_installed_live_evidence tests.unit.test_installed_live_pipeline
          python3 scripts/installed_schema_pipeline.py
          python3 -m scripts.installed_live_pipeline --plan
  unit-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject tracked runtime outputs in public Git
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files -- 'reports/portable/**' 'reports/deliveries/**' 'dashboards/dashboard_standalone.html')"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Private/runtime artifacts are tracked in Git. Remove them from HEAD."
            echo "$forbidden"
            exit 1
          fi
          echo "No generated portable HTML, manifest, Telegram receipts, or dashboard snapshot tracked."
      - name: Complete 89-registered-suite OFFLINE regression (1 live blocked)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BTC_RESEARCH_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 tests/run_all.py | tee "$RUNNER_TEMP/package_a_offline_runner.log"
          grep -q '^OFFLINE_SUITES_EXECUTED=88$' "$RUNNER_TEMP/package_a_offline_runner.log"
          grep -q '^OFFLINE_SUITES_PASSED=88$' "$RUNNER_TEMP/package_a_offline_runner.log"
          grep -q '^LIVE_SUITES_SKIPPED=1$' "$RUNNER_TEMP/package_a_offline_runner.log"
          grep -q '^LIVE_STATUS=NOT_TESTED_NOT_AUTHORIZED$' "$RUNNER_TEMP/package_a_offline_runner.log"
      - name: Isolated worktree runtime retention regression
        env:
          BTC_RESEARCH_HOME: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -v tests.unit.test_hermes_skill.HermesSkillTests.test_local_runtime_artifact_retention_survives_git_untracking
      - name: Install pinned local visual QA tools (no market APIs)
        run: |
          npm install --prefix "$RUNNER_TEMP/b-visual-tools" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/b-visual-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Synthetic report responsive and A4 acceptance (no upload or publication)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BTC_RESEARCH_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/package_b_report_fixture.py --output-dir "$RUNNER_TEMP/b-report"
          node scripts/package_b_visual_qa.cjs \
            --html "$RUNNER_TEMP/b-report/package_b_synthetic_report.html" \
            --gate "$RUNNER_TEMP/b-report/package_b_synthetic_gate.json" \
            --output-dir "$RUNNER_TEMP/b-visual-evidence" \
            --playwright-module "$RUNNER_TEMP/b-visual-tools/node_modules/playwright"
      - name: Complete C archived report and responsive A4 acceptance (fixture only)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BTC_RESEARCH_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/package_c_pipeline_fixture.py
          python3 scripts/package_c_pipeline_fixture.py --root "$RUNNER_TEMP/package-a-fixture-c-ci" --prepare
          python3 scripts/package_c_pipeline_fixture.py --root "$RUNNER_TEMP/package-a-fixture-c-ci" --apply
          python3 scripts/package_c_pipeline_fixture.py --root "$RUNNER_TEMP/package-a-fixture-c-ci" --apply
          node scripts/package_b_visual_qa.cjs \
            --html "$RUNNER_TEMP/package-a-fixture-c-ci/artifacts/report.html" \
            --gate "$RUNNER_TEMP/package-a-fixture-c-ci/artifacts/gate.json" \
            --output-dir "$RUNNER_TEMP/c-visual-evidence" \
            --playwright-module "$RUNNER_TEMP/b-visual-tools/node_modules/playwright"
      - name: Installed-schema fixture report responsive and A4 acceptance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BTC_RESEARCH_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 tests/fixtures/installed_report_example.py --output-dir "$RUNNER_TEMP/installed-report"
          node scripts/package_b_visual_qa.cjs \
            --html "$RUNNER_TEMP/installed-report/report.html" \
            --gate "$RUNNER_TEMP/installed-report/gate.json" \
            --output-dir "$RUNNER_TEMP/installed-visual-evidence" \
            --playwright-module "$RUNNER_TEMP/b-visual-tools/node_modules/playwright"
      - name: Native live binding synthetic report responsive and A4 acceptance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BTC_RESEARCH_HOME: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 tests/fixtures/live_report_example.py --output-dir "$RUNNER_TEMP/live-report"
          node scripts/package_b_visual_qa.cjs \
            --html "$RUNNER_TEMP/live-report/report.html" \
            --gate "$RUNNER_TEMP/live-report/gate.json" \
            --output-dir "$RUNNER_TEMP/live-visual-evidence" \
            --playwright-module "$RUNNER_TEMP/b-visual-tools/node_modules/playwright"
